<text x="790" y="481" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">Native USB-C: MIDI / ROM serial flashing.</text>
<text x="790" y="504" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">B1 to GND, tap RST, remove jumper to flash.</text>
<text x="790" y="527" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">VBUS divider: 3.0V at 5.0V USB input.</text>
<text x="790" y="550" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">Keep converter +5V separate from USB VBUS.</text>
<text x="790" y="573" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">USB-only power leaves the LED rail off.</text>
<text x="42" y="619" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#183044" text-anchor="start">SW11  20-detent encoder with click - direct wiring</text>
<text x="42" y="645" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">No external resistors or capacitors. Firmware enables internal pull-ups on GPIO7, GPIO8 and GPIO9.</text>
