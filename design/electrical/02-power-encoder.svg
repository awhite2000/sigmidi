<text x="42" y="78" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#183044" text-anchor="start">Power distribution and rotary encoder</text>
<text x="42" y="104" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#526575" text-anchor="start">9V center-negative input; 3V3 logic; VIN receives 9V; converter 5V powers only optional LEDs. USB VBUS is sensed, not joined to 5V.</text>
