<text x="66" y="820" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">Each loop: MIDI_5V -&gt; 220R -&gt; ring -&gt; receiver optocoupler -&gt; tip -&gt; 220R -&gt; buffer output sink (J3: R53/R54/1Y, J4: R55/R56/2Y).</text>
<text x="66" y="850" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">TRS Type A: tip = DIN pin 5, ring = DIN pin 4, sleeve = DIN pin 2. Each sleeve connects to GND to ground the cable shield.</text>
<text x="66" y="880" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">One-way outputs only; no receive connection to the Nano. Use Type A adapters or cables for 5-pin DIN receivers.</text>
</svg>