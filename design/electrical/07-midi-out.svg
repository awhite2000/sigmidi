<text x="66" y="772" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">MIDI OUT loop: MIDI_5V -&gt; R53 -&gt; DIN 4 -&gt; receiver optocoupler -&gt; DIN 5 -&gt; R54 -&gt; buffer 1Y sink.</text>
<text x="66" y="802" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">DIN pins 1, 2 (shield) and 3 are unconnected; circuit ground does not go to the DIN.</text>
<text x="66" y="832" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">One-way output only; no receive connection to the Nano. Verify DIN-5 numbering against the chosen connector datasheet view.</text>
