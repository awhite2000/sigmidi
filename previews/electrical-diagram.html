<text x="1358" y="961" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#526575" text-anchor="end">7 / 7  |  28 OCT 2026</text>
<text x="42" y="155" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#183044" text-anchor="start">Harness and assembly rules</text>
<text x="42" y="185" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">All GND symbols are the same electrical net. Run analog returns separately to the controller ground point.</text>
<text x="42" y="210" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">Keep LADDER and pedal signals away from LED power/data and the DC converter. Pair signals with ground.</text>
<text x="42" y="235" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">Feed LED +5V/GND directly from the power distribution, rather than through the DFRobot headers.</text>
<text x="42" y="260" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">The 10-pixel chain can draw about 0.5A at full white. Keep total load within the 1A converter rating.</text>
<text x="42" y="285" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">LED lead order, lens pointing left and leads right, flat side down: top DIN, +5V, GND, bottom DOUT.</text>
<text x="42" y="310" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">The LED chain contains only Pololu 2535 LEDs and wiring: GPIO16 directly to the first DIN.</text>
<text x="42" y="335" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">Encoder terminal labels are functions; a specific encoder package pin numbering has not been selected.</text>
<text x="42" y="360" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">GPIO numbers are logical; D/A labels and SCK/MOSI/TX names identify the external board pins.</text>
<text x="42" y="428" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#183044" text-anchor="start">Prototype verification</text>
<text x="42" y="457" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">With power disconnected: continuity-check TRS terminals, power polarity, ground and all off-sheet nets.</text>
<text x="42" y="482" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">Verify regulated +5V, then U1 3V3. Flash the passive-input firmware and recalibrate both pedals.</text>
<text x="42" y="507" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">Check resistor-mode HIGH / pot-mode high impedance, ADC ranges, ladder taps, encoder and BLE MIDI.</text>
<text x="42" y="532" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">Each passive pedal input uses two resistors. Connect only unpowered variable-resistor or pot pedals.</text>
<text x="42" y="557" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#183044" text-anchor="start">This document does not establish ESD compliance, measured analog accuracy or simultaneous-supply qualification.</text>
